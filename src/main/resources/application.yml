# ---------------------------------------------------------------------------
# Slotify Backend - base configuration (all profiles).
#
# Secrets and environment-specific values come from environment variables
# (see .env.example). For local development, copy .env.example to .env;
# the file is imported below and its keys are exposed as properties.
# Profiles: dev (default), demo (seeds demo data), prod, test.
# ---------------------------------------------------------------------------
spring:
  application:
    name: slotify-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true # Java 21 virtual threads for request handling

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:slotify}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:slotify}
    password: ${DB_PASSWORD:slotify}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # All timestamps are stored in UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  thymeleaf:
    check-template-location: false # templates are only used for emails

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false # do not ping SMTP on every health check

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# ---------------------------------------------------------------------------
# Application-specific settings (bound to com.slotify.config.AppProperties)
# ---------------------------------------------------------------------------
app:
  name: Slotify
  base-url: ${APP_BASE_URL:http://localhost:8080}
  web-url: ${APP_WEB_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-at-least-64-random-characters-for-hs512-signing}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  auth:
    require-email-verification: ${AUTH_REQUIRE_EMAIL_VERIFICATION:false}
    email-verification-ttl: 24h
    password-reset-ttl: 1h
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@slotify.local}

---
# ---------------------------------------------------------------------------
# dev: verbose logging, SQL echo
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
logging:
  level:
    com.slotify: DEBUG
    org.springframework.security: INFO

---
# ---------------------------------------------------------------------------
# demo: same as dev but seeds demo data on startup (see DataSeeder, Phase 1)
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: demo
app:
  seed-demo-data: true

---
# ---------------------------------------------------------------------------
# prod: quiet logging, no devtools
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod
  devtools:
    restart:
      enabled: false
logging:
  level:
    root: INFO
    com.slotify: INFO
