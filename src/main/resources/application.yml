# ---------------------------------------------------------------------------
# Slotify Backend - single configuration for every environment.
#
# There are no Spring profiles to pick: everything that differs per machine
# (secrets, ports, log level, whether to seed demo data) comes from environment
# variables or the .env file imported below (see .env.example). The only extra
# profile is `test`, activated by the integration tests.
# ---------------------------------------------------------------------------
spring:
  application:
    name: slotify-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true # Java 21 virtual threads for request handling

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:slotify}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:slotify}
    password: ${DB_PASSWORD:slotify}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # All timestamps are stored in UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  thymeleaf:
    check-template-location: false # templates are only used for emails

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false # do not ping SMTP on every health check

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# ---------------------------------------------------------------------------
# Application-specific settings (bound to com.slotify.config.AppProperties)
# ---------------------------------------------------------------------------
app:
  name: Slotify
  # Inserts the demo salons/accounts on first start (idempotent). Set
  # SEED_DEMO_DATA=false for an empty database.
  seed-demo-data: ${SEED_DEMO_DATA:true}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  web-url: ${APP_WEB_URL:http://localhost:3000}
  demo:
    admin-email: ${DEMO_ADMIN_EMAIL:admin@slotify.demo}
    admin-password: ${DEMO_ADMIN_PASSWORD:Password123!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-at-least-64-random-characters-for-hs512-signing}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  auth:
    require-email-verification: ${AUTH_REQUIRE_EMAIL_VERIFICATION:false}
    email-verification-ttl: 24h
    password-reset-ttl: 1h
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@slotify.local}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:eu-central-1}
    bucket: ${S3_BUCKET:slotify}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/slotify}
    presign-ttl: 10m
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    mode: ${PAYPAL_MODE:sandbox}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
  booking:
    unpaid-timeout: ${BOOKING_UNPAID_TIMEOUT:15m}

logging:
  level:
    root: INFO
    com.slotify: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
