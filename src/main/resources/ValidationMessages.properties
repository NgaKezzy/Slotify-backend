# Bean Validation messages for the custom constraints of this project (English, default).
# Standard constraints (@NotBlank, @Size, ...) use Hibernate Validator's built-in bundle,
# which is already translated for de/fr/es/it; Vietnamese lives in ValidationMessages_vi.
# Picked up by locale thanks to Spring's LocaleContextMessageInterpolator (Accept-Language).
validation.phone=must be a valid phone number
validation.image_type=must be a JPEG, PNG or WebP
validation.upload_folder=must be one of: salons, services, avatars
validation.country_code=must be an ISO-3166 alpha-2 code
validation.currency_code=must be an ISO-4217 code
validation.language_code=must be a language code like en or de
validation.hex_colour=must be a hex colour like #FF8800
validation.coupon_code=must be 3-50 letters, digits or hyphens
