<!DOCTYPE html>
<!-- Shared wrapper for all transactional emails. Edit colours/logo here to rebrand. -->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f7;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#7c3aed;padding:24px 32px;color:#ffffff;font-size:22px;font-weight:700;" th:text="${appName}">Slotify</td>
          </tr>
          <tr>
            <td style="padding:32px;font-size:16px;line-height:1.6;" th:insert="${content}"></td>
          </tr>
          <tr>
            <td style="padding:16px 32px 24px;font-size:12px;color:#7b8794;">
              You received this email because an account was created with this address on
              <span th:text="${appName}">Slotify</span>. If that wasn't you, you can safely ignore it.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
