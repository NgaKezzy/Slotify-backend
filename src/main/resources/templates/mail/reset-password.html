<!DOCTYPE html>
<!-- Sent for the "forgot password" flow. Variables: name, link, appName. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/_layout :: layout(~{::content})}">
<body>
  <div th:fragment="content">
    <p>Hi <strong th:text="${name}">there</strong>,</p>
    <p>We received a request to reset your password. Click the button below to choose a new one. The link is valid for one hour.</p>
    <p style="text-align:center;margin:32px 0;">
      <a th:href="${link}" style="background:#7c3aed;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:600;display:inline-block;">Reset password</a>
    </p>
    <p style="font-size:13px;color:#7b8794;">If you didn't request a password reset, no action is needed.</p>
  </div>
</body>
</html>
