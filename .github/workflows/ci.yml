# Continuous integration: format check, static analysis, unit + integration tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (Spotless, Checkstyle, tests with Testcontainers)
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t slotify-backend:ci .
