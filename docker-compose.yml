# ---------------------------------------------------------------------------
# Local development stack for the Slotify backend.
#
#   docker compose up -d            # start MySQL, Redis, MinIO, MailHog
#   docker compose --profile api up  # additionally build & run the API itself
#
# Values are read from .env (copy .env.example first).
# ---------------------------------------------------------------------------
services:
  mysql:
    image: mysql:8.4
    container_name: slotify-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-slotify}
      MYSQL_USER: ${DB_USER:-slotify}
      MYSQL_PASSWORD: ${DB_PASSWORD:-slotify}
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: slotify-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  # S3-compatible object storage for salon/service images.
  minio:
    image: minio/minio:latest
    container_name: slotify-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot job: creates the bucket the API uploads to and allows anonymous
  # reads so presigned uploads and public image URLs work out of the box.
  minio-init:
    image: minio/mc:latest
    container_name: slotify-minio-init
    depends_on:
      - minio
    environment:
      S3_BUCKET: ${S3_BUCKET:-slotify}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" >/dev/null 2>&1; do sleep 1; done;
        mc mb --ignore-existing local/$$S3_BUCKET;
        mc anonymous set download local/$$S3_BUCKET;
      "

  # Catches all outgoing email in development. Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: slotify-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    container_name: slotify-api
    profiles: ["api"]
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MAIL_HOST: mailhog
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  minio-data:
